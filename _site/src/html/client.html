<script>
  // ---------- session store ----------
  const STORAGE_KEY = 'acdec.session';

  const session = {
    get() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); }
      catch (e) { return null; }
    },
    set(s) { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); },
    clear() { localStorage.removeItem(STORAGE_KEY); }
  };

  // ---------- RPC wrapper ----------
  function call(fn /* , ...args */) {
    const args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      // Must call the RPC function as a method on the runner (not apply(null))
      // so the runner retains its registered success/failure handlers.
      const runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function (err) { reject(new Error(err && err.message ? err.message : 'Request failed')); });
      runner[fn].apply(runner, args);
    });
  }

  // Authenticated call — auto-injects token as first arg.
  function callAuth(fn /* , ...args */) {
    const s = session.get();
    if (!s || !s.token) { nav('#/login'); return Promise.reject(new Error('Not logged in')); }
    const args = Array.prototype.slice.call(arguments, 1);
    return call.apply(null, [fn, s.token].concat(args)).catch(function (err) {
      if (/expired|log in/i.test(err.message)) { session.clear(); nav('#/login'); }
      throw err;
    });
  }

  // ---------- DOM helpers ----------
  function $(sel, root) { return (root || document).querySelector(sel); }
  function el(tag, attrs, children) {
    const node = document.createElement(tag);
    if (attrs) {
      for (const k in attrs) {
        if (k === 'class') node.className = attrs[k];
        else if (k === 'html') node.innerHTML = attrs[k];
        else if (k.slice(0, 2) === 'on') node.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
        else node.setAttribute(k, attrs[k]);
      }
    }
    (children || []).forEach(function (c) {
      if (c == null) return;
      node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return node;
  }
  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // Render LaTeX inside an element using KaTeX auto-render.
  // Degrades gracefully to plain text if the CDN script hasn't loaded.
  function renderMath(element) {
    if (typeof renderMathInElement !== 'function') return;
    renderMathInElement(element, {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '$',  right: '$',  display: false },
        { left: '\\[', right: '\\]', display: true },
        { left: '\\(', right: '\\)', display: false }
      ],
      throwOnError: false
    });
  }

  function showError(container, msg) {
    const div = el('div', { class: 'error' }, [msg]);
    container.prepend(div);
    setTimeout(function () { div.remove(); }, 5000);
  }
  function showOk(container, msg) {
    const div = el('div', { class: 'ok' }, [msg]);
    container.prepend(div);
    setTimeout(function () { div.remove(); }, 4000);
  }

  // ---------- router ----------
  function nav(hash) { if (location.hash === hash) render(); else location.hash = hash; }

  function render() {
    const main = $('#main');
    const hash = location.hash || '#/';
    const s = session.get();
    updateTopbar(s);

    if (!s || !s.token) {
      if (hash !== '#/login') { location.hash = '#/login'; return; }
      return renderLogin(main);
    }

    if (hash === '#/' || hash === '#/dashboard') return renderDashboard(main, s);
    if (hash === '#/study') return renderStudy(main, s);
    if (hash === '#/quiz') return renderQuiz(main, s);
    if (hash === '#/leaderboard') return renderLeaderboard(main, s);
    if (hash === '#/teacher') return s.user.role === 'teacher' ? renderTeacher(main, s) : nav('#/');
    if (hash === '#/password') return renderChangePassword(main, s);
    nav('#/');
  }

  function updateTopbar(s) {
    const bar = $('#topbar');
    bar.innerHTML = '';
    bar.appendChild(el('div', { class: 'brand' }, ['UIL Study']));
    if (!s || !s.token) return;
    const nav_ = el('nav');
    [
      ['#/', 'Home'],
      ['#/study', 'Study'],
      ['#/quiz', 'Quiz'],
      ['#/leaderboard', 'Leaderboard']
    ].forEach(function (pair) {
      nav_.appendChild(el('a', { href: pair[0] }, [pair[1]]));
    });
    if (s.user.role === 'teacher') nav_.appendChild(el('a', { href: '#/teacher' }, ['Teacher']));
    bar.appendChild(nav_);
    bar.appendChild(el('span', { class: 'who' }, [s.user.firstName || s.user.email]));
    bar.appendChild(el('button', { class: 'link', onclick: function () {
      session.clear(); nav('#/login');
    } }, ['Sign out']));
  }

  window.addEventListener('hashchange', render);
  window.addEventListener('DOMContentLoaded', render);
</script>
