<script>
  function renderLeaderboard(main, s) {
    main.innerHTML = '';
    const card = el('div', { class: 'card' });
    card.appendChild(el('h2', null, ['Leaderboard']));
    const toggleRow = el('div', { class: 'btn-row', style: 'margin-bottom:12px;' });
    const allBtn = el('button', { class: 'ghost' }, ['All-time']);
    const weekBtn = el('button', null, ['Last 7 days']);
    toggleRow.appendChild(weekBtn); toggleRow.appendChild(allBtn);
    card.appendChild(toggleRow);
    const body = el('div', null, ['Loading…']);
    card.appendChild(body);
    main.appendChild(card);

    function load(window_) {
      if (window_ === '7d') { weekBtn.className = ''; allBtn.className = 'ghost'; }
      else { weekBtn.className = 'ghost'; allBtn.className = ''; }
      body.innerHTML = 'Loading…';
      callAuth('getLeaderboard', window_).then(function (res) {
        body.innerHTML = '';
        if (!res.entries.length) {
          body.appendChild(el('p', { class: 'muted' }, ['No points yet. Be the first — study some cards!']));
          return;
        }
        const ul = el('ol', { class: 'rank-list', style: 'list-style:none;padding:0;margin:0;' });
        res.entries.forEach(function (e) {
          const li = el('li');
          li.appendChild(el('span', { class: 'rank' }, ['#' + e.rank]));
          li.appendChild(el('span', { class: 'name' }, [e.displayName || '(anon)']));
          li.appendChild(el('span', { class: 'tag' }, [e.reviews + ' reviews · ' + e.correctAnswers + ' correct']));
          li.appendChild(el('span', { class: 'pts' }, [String(e.points) + ' pts']));
          ul.appendChild(li);
        });
        body.appendChild(ul);
        body.appendChild(el('p', { class: 'muted small' }, [
          'Updated ' + new Date(res.generatedAt).toLocaleTimeString() + '. Points: 1 per flashcard review, 2 per correct quiz answer.'
        ]));
      }).catch(function (err) { body.innerHTML = ''; showError(card, err.message); });
    }
    weekBtn.addEventListener('click', function () { load('7d'); });
    allBtn.addEventListener('click', function () { load('all'); });
    load('7d');
  }
</script>
