<script>
  function renderDashboard(main, s) {
    main.innerHTML = '';
    const greeting = el('div', { class: 'card' });
    greeting.appendChild(el('h2', null, ['Welcome, ' + (s.user.firstName || s.user.email)]));
    greeting.appendChild(el('p', { class: 'muted' }, [
      'Choose how you want to train today. Flashcards build long-term recall; quizzes check what you know under pressure.'
    ]));
    const actionRow = el('div', { class: 'btn-row' });
    actionRow.appendChild(el('a', { class: 'btn', href: '#/study' }, ['Study flashcards']));
    actionRow.appendChild(el('a', { class: 'btn ghost', href: '#/quiz' }, ['Take a quiz']));
    actionRow.appendChild(el('a', { class: 'btn ghost', href: '#/leaderboard' }, ['Leaderboard']));
    actionRow.appendChild(el('a', { class: 'btn ghost', href: '#/password' }, ['Change password']));
    greeting.appendChild(actionRow);
    main.appendChild(greeting);

    const statsCard = el('div', { class: 'card' });
    statsCard.appendChild(el('h2', null, ['Your progress']));
    const statsBody = el('div', null, ['Loading…']);
    statsCard.appendChild(statsBody);
    main.appendChild(statsCard);

    const attemptsCard = el('div', { class: 'card' });
    attemptsCard.appendChild(el('h2', null, ['Recent quiz attempts']));
    const attemptsBody = el('div', null, ['Loading…']);
    attemptsCard.appendChild(attemptsBody);
    main.appendChild(attemptsCard);

    callAuth('getStudyStats').then(function (stats) {
      statsBody.innerHTML = '';
      const totalPending = stats.subjects.reduce(function (n, s) { return n + ((stats.bySubject[s] || {}).pending || 0); }, 0);
      statsBody.appendChild(el('p', null, ['Total pending: ', el('strong', null, [String(totalPending)])]));
      const tbl = el('table');
      tbl.innerHTML = '<thead><tr><th>Subject</th><th>Pending</th><th>Known</th><th>Total cards</th></tr></thead>';
      const tbody = el('tbody');
      stats.subjects.forEach(function (subj) {
        const row = stats.bySubject[subj] || { pending: 0, known: 0, total: 0 };
        const tr = el('tr');
        tr.innerHTML = '<td>' + escapeHtml(subj) + '</td><td>' + row.pending + '</td><td>' + row.known + '</td><td>' + row.total + '</td>';
        tbody.appendChild(tr);
      });
      tbl.appendChild(tbody);
      statsBody.appendChild(tbl);
    }).catch(function (err) { statsBody.innerHTML = ''; showError(statsCard, err.message); });

    callAuth('getMyAttempts', 5).then(function (attempts) {
      attemptsBody.innerHTML = '';
      if (!attempts.length) { attemptsBody.appendChild(el('p', { class: 'muted' }, ['No attempts yet.'])); return; }
      const tbl = el('table');
      tbl.innerHTML = '<thead><tr><th>When</th><th>Subject</th><th>Score</th></tr></thead>';
      const tbody = el('tbody');
      attempts.forEach(function (a) {
        const tr = el('tr');
        const when = a.completedAt ? new Date(a.completedAt).toLocaleString() : '';
        const pct = a.totalQuestions > 0 ? Math.round(100 * a.score / a.totalQuestions) + '%' : '—';
        tr.innerHTML = '<td>' + escapeHtml(when) + '</td><td>' + escapeHtml(a.subject) + '</td><td>' + a.score + ' / ' + a.totalQuestions + ' &nbsp;<span class="tag">' + pct + '</span></td>';
        tbody.appendChild(tr);
      });
      tbl.appendChild(tbody);
      attemptsBody.appendChild(tbl);
    }).catch(function (err) { attemptsBody.innerHTML = ''; showError(attemptsCard, err.message); });
  }

  function renderChangePassword(main, s) {
    main.innerHTML = '';
    const card = el('div', { class: 'card' });
    card.appendChild(el('h2', null, ['Change password']));
    const form = el('form');
    form.appendChild(el('label', null, ['Current password']));
    const cur = el('input', { type: 'password', required: 'required' });
    form.appendChild(cur);
    form.appendChild(el('label', null, ['New password (min 6 chars)']));
    const nw = el('input', { type: 'password', required: 'required' });
    form.appendChild(nw);
    const btn = el('button', { type: 'submit', style: 'margin-top:16px;' }, ['Update']);
    form.appendChild(btn);
    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      btn.disabled = true;
      callAuth('changePassword', cur.value, nw.value).then(function () {
        showOk(card, 'Password updated.');
        cur.value = ''; nw.value = '';
      }).catch(function (e) { showError(card, e.message); })
        .then(function () { btn.disabled = false; });
    });
    card.appendChild(form);
    main.appendChild(card);
  }
</script>
