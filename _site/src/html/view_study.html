<script>
  function renderStudy(main, s) {
    main.innerHTML = '';
    const pickerCard = el('div', { class: 'card' });
    pickerCard.appendChild(el('h2', null, ['Study flashcards']));
    pickerCard.appendChild(el('p', { class: 'muted small' }, ['Pick a subject. You’ll get cards that are due, then new ones.']));

    const subjSelect = el('select', { id: 'study-subject' });
    subjSelect.appendChild(el('option', { value: '' }, ['All subjects']));
    (window.SUBJECTS || []).forEach(function (subj) {
      subjSelect.appendChild(el('option', { value: subj }, [subj]));
    });
    pickerCard.appendChild(el('label', null, ['Subject']));
    pickerCard.appendChild(subjSelect);

    const sectionLabel = el('label', { style: 'display:none;' }, ['Section']);
    const sectionSelect = el('select', { id: 'study-section', style: 'display:none;' });
    pickerCard.appendChild(sectionLabel);
    pickerCard.appendChild(sectionSelect);

    function refreshSections() {
      sectionSelect.innerHTML = '';
      if (!subjSelect.value) {
        sectionLabel.style.display = 'none';
        sectionSelect.style.display = 'none';
        return;
      }
      sectionSelect.appendChild(el('option', { value: '' }, ['All sections']));
      callAuth('listSections', subjSelect.value, 'flashcards').then(function (sections) {
        if (!sections.length) {
          sectionLabel.style.display = 'none';
          sectionSelect.style.display = 'none';
          return;
        }
        sections.forEach(function (name) {
          sectionSelect.appendChild(el('option', { value: name }, [name]));
        });
        sectionLabel.style.display = '';
        sectionSelect.style.display = '';
      }).catch(function () { /* ignore */ });
    }
    subjSelect.addEventListener('change', refreshSections);

    const sizeInp = el('input', { type: 'number', min: '1', max: '50', value: '20', id: 'study-size' });
    pickerCard.appendChild(el('label', null, ['Cards this session']));
    pickerCard.appendChild(sizeInp);

    const startBtn = el('button', { style: 'margin-top:16px;' }, ['Start studying']);
    pickerCard.appendChild(startBtn);
    main.appendChild(pickerCard);

    startBtn.addEventListener('click', function () {
      startBtn.disabled = true;
      startBtn.textContent = 'Loading cards…';
      const subjectVal = subjSelect.value || null;
      const sectionVal = sectionSelect.value || null;
      callAuth('getNextCards', subjectVal, sectionVal, Number(sizeInp.value) || 20).then(function (res) {
        if (!res.cards.length) {
          startBtn.disabled = false;
          startBtn.textContent = 'Start studying';
          showError(pickerCard, 'No cards available right now. Try another subject or section.');
          return;
        }
        runSession(main, res.cards);
      }).catch(function (err) {
        startBtn.disabled = false;
        startBtn.textContent = 'Start studying';
        showError(pickerCard, err.message);
      });
    });
  }

  function runSession(main, cards) {
    main.innerHTML = '';
    const header = el('div', { class: 'card' });
    const progress = el('p', { class: 'muted' }, []);
    header.appendChild(el('h2', null, ['Flashcards']));
    header.appendChild(progress);
    main.appendChild(header);

    const wrap = el('div', { class: 'flashcard-wrap' });
    const face = el('div', { class: 'flashcard' });
    const sideLabel = el('div', { class: 'side-label' }, ['Front']);
    face.appendChild(sideLabel);
    const mediaEl = el('div', { class: 'card-media-wrap' });
    face.appendChild(mediaEl);
    const content = el('div', null, []);
    face.appendChild(content);
    const reportBtn = el('button', { class: 'report-btn' }, ['Report']);
    wrap.appendChild(face);
    wrap.appendChild(reportBtn);
    header.appendChild(wrap);

    const ratingRow = el('div', { class: 'rating-row' });
    const hardBtn = el('button', { class: 'hard' }, ['Hard']);
    const medBtn = el('button', { class: 'med' }, ['Medium']);
    const easyBtn = el('button', { class: 'easy' }, ['Easy']);
    ratingRow.appendChild(hardBtn); ratingRow.appendChild(medBtn); ratingRow.appendChild(easyBtn);
    header.appendChild(ratingRow);

    let i = 0;
    let showingBack = false;
    let pending = [];

    reportBtn.addEventListener('click', function () {
      const c = cards[i];
      if (!c || reportBtn.disabled) return;
      reportBtn.disabled = true;
      reportBtn.textContent = 'Reporting…';
      callAuth('flagCard', c.cardId).then(function () {
        reportBtn.textContent = 'Reported';
      }).catch(function (err) {
        showError(header, err.message);
        reportBtn.disabled = false;
        reportBtn.textContent = 'Report';
      });
    });

    function showFront() {
      reportBtn.disabled = false;
      reportBtn.textContent = 'Report';
      const c = cards[i];
      if (!c) {
        Promise.all(pending).then(function () {
          main.innerHTML = '';
          const done = el('div', { class: 'card' });
          done.appendChild(el('h2', null, ['Session complete.']));
          done.appendChild(el('p', { class: 'muted' }, ['Nice work. Come back tomorrow to review cards that come due.']));
          const row = el('div', { class: 'btn-row' });
          row.appendChild(el('a', { class: 'btn', href: '#/study' }, ['Study more']));
          row.appendChild(el('a', { class: 'btn ghost', href: '#/' }, ['Home']));
          done.appendChild(row);
          main.appendChild(done);
        });
        return;
      }
      progress.textContent = 'Card ' + (i + 1) + ' of ' + cards.length + ' — ' + c.subject + (c.section ? ' · ' + c.section : '');
      sideLabel.textContent = 'Front (click to flip)';
      mediaEl.innerHTML = '';
      if (c.mediaType === 'image' && c.mediaDriveId) {
        mediaEl.appendChild(el('img', { class: 'card-media', src: 'https://drive.google.com/uc?export=view&id=' + c.mediaDriveId }));
      } else if (c.mediaType === 'audio' && c.mediaDriveId) {
        const audioSrc = 'https://drive.google.com/uc?export=download&id=' + c.mediaDriveId;
        const playBtn = el('button', { class: 'card-media audio-play' }, ['Play']);
        playBtn.addEventListener('click', function (e) { e.stopPropagation(); new Audio(audioSrc).play(); });
        mediaEl.appendChild(playBtn);
      }
      content.textContent = c.front;
      renderMath(content);
      showingBack = false;
      setRatingEnabled(false);
    }
    function showBack() {
      const c = cards[i];
      sideLabel.textContent = 'Back';
      mediaEl.innerHTML = '';
      content.textContent = c.back;
      renderMath(content);
      showingBack = true;
      setRatingEnabled(true);
    }
    function setRatingEnabled(on) {
      hardBtn.disabled = !on; medBtn.disabled = !on; easyBtn.disabled = !on;
    }
    face.addEventListener('click', function () { if (!showingBack) showBack(); else showFront(); });
    function rate(r) {
      if (!showingBack) return;
      const c = cards[i];
      i += 1;
      showFront();
      pending.push(
        callAuth('submitReview', c.cardId, r).catch(function (err) {
          showError(header, err.message);
        })
      );
    }
    hardBtn.addEventListener('click', function () { rate(2); });
    medBtn.addEventListener('click', function () { rate(3); });
    easyBtn.addEventListener('click', function () { rate(5); });

    document.addEventListener('keydown', function onKey(ev) {
      if (!document.body.contains(face)) { document.removeEventListener('keydown', onKey); return; }
      if (ev.key === ' ' || ev.key === 'Enter') { ev.preventDefault(); showingBack ? showFront() : showBack(); }
      else if (showingBack) {
        if (ev.key === '1') rate(2);
        else if (ev.key === '2') rate(3);
        else if (ev.key === '3') rate(5);
      }
    });

    showFront();
  }
</script>
