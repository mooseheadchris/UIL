<script>
  function renderTeacher(main, s) {
    main.innerHTML = '';
    const intro = el('div', { class: 'card' });
    intro.appendChild(el('h2', null, ['Teacher dashboard']));
    intro.appendChild(el('p', { class: 'muted small' }, [
      'Upload rosters and content, view participation, reset student passwords.'
    ]));
    main.appendChild(intro);

    // Roster import
    const rosterCard = el('div', { class: 'card' });
    rosterCard.appendChild(el('h2', null, ['Import roster']));
    rosterCard.appendChild(el('p', { class: 'muted small' }, [
      'CSV columns (header row optional): email, firstName, lastName, initialPassword, role. Role is "student" or "teacher".'
    ]));
    const rosterTa = el('textarea', { placeholder: 'email,firstName,lastName,initialPassword,role\nstudent1@school.edu,Jordan,Lee,Temp1234,student' });
    rosterCard.appendChild(rosterTa);
    const rosterBtn = el('button', { style: 'margin-top:10px;' }, ['Import roster']);
    rosterCard.appendChild(rosterBtn);
    rosterBtn.addEventListener('click', function () {
      rosterBtn.disabled = true;
      callAuth('teacher_importRoster', rosterTa.value).then(function (res) {
        showOk(rosterCard, 'Created ' + res.created + ' users.' + (res.skipped.length ? ' Skipped: ' + res.skipped.join(', ') : ''));
        rosterTa.value = '';
        loadUsers();
      }).catch(function (e) { showError(rosterCard, e.message); })
        .then(function () { rosterBtn.disabled = false; });
    });
    main.appendChild(rosterCard);

    // Roster table
    const usersCard = el('div', { class: 'card' });
    usersCard.appendChild(el('h2', null, ['Roster']));
    const usersBody = el('div', null, ['Loading…']);
    usersCard.appendChild(usersBody);
    main.appendChild(usersCard);

    function loadUsers() {
      callAuth('teacher_listUsers').then(function (users) {
        usersBody.innerHTML = '';
        const tbl = el('table');
        tbl.innerHTML = '<thead><tr><th>Email</th><th>Name</th><th>Role</th><th>Last login</th><th></th></tr></thead>';
        const tbody = el('tbody');
        users.forEach(function (u) {
          const tr = el('tr');
          tr.appendChild(el('td', null, [u.email]));
          tr.appendChild(el('td', null, [((u.firstName || '') + ' ' + (u.lastName || '')).trim()]));
          tr.appendChild(el('td', null, [u.role]));
          tr.appendChild(el('td', null, [u.lastLoginAt ? new Date(u.lastLoginAt).toLocaleString() : '—']));
          const tdBtn = el('td');
          const btn = el('button', { class: 'ghost small' }, ['Reset pw']);
          btn.addEventListener('click', function () {
            if (!confirm('Reset password for ' + u.email + '?')) return;
            callAuth('teacher_resetPassword', u.email).then(function (res) {
              prompt('Temporary password for ' + res.email + ' (copy now; shown once):', res.tempPassword);
            }).catch(function (e) { showError(usersCard, e.message); });
          });
          tdBtn.appendChild(btn);
          tr.appendChild(tdBtn);
          tbody.appendChild(tr);
        });
        tbl.appendChild(tbody);
        usersBody.appendChild(tbl);
      }).catch(function (err) { usersBody.innerHTML = ''; showError(usersCard, err.message); });
    }
    loadUsers();

    // Content upload — flashcards
    const cardsCard = el('div', { class: 'card' });
    cardsCard.appendChild(el('h2', null, ['Upload flashcards']));
    cardsCard.appendChild(el('p', { class: 'muted small' }, ['CSV header row required. Columns: subject, section (optional), front, back. Subjects must be one of: ' + (window.SUBJECTS || []).join(', ')]));
    const cardsTa = el('textarea', { placeholder: 'subject,section,front,back\nMathematics,Section 1,What is the derivative of x^2?,2x' });
    cardsCard.appendChild(cardsTa);
    const cardsBtn = el('button', { style: 'margin-top:10px;' }, ['Upload flashcards']);
    cardsCard.appendChild(cardsBtn);
    cardsBtn.addEventListener('click', function () {
      cardsBtn.disabled = true;
      callAuth('teacher_uploadFlashcards', cardsTa.value).then(function (res) {
        const msg = 'Created ' + res.created + ' flashcards.' + (res.errors && res.errors.length ? ' Errors: ' + res.errors.join('; ') : '');
        showOk(cardsCard, msg);
        cardsTa.value = '';
        loadCounts();
      }).catch(function (e) { showError(cardsCard, e.message); })
        .then(function () { cardsBtn.disabled = false; });
    });
    main.appendChild(cardsCard);

    // Single card with media
    const mediaCard = el('div', { class: 'card' });
    mediaCard.appendChild(el('h2', null, ['Add card with media']));
    mediaCard.appendChild(el('p', { class: 'muted small' }, ['Add one flashcard at a time with an image or audio clip on the front.']));

    const mcSubj = el('select');
    mcSubj.appendChild(el('option', { value: '' }, ['— select subject —']));
    (window.SUBJECTS || []).forEach(function (s) { mcSubj.appendChild(el('option', { value: s }, [s])); });
    const mcSection = el('input', { type: 'text', placeholder: 'Section (optional)' });
    const mcFront = el('textarea', { rows: '2', placeholder: 'Front text' });
    const mcBack = el('textarea', { rows: '3', placeholder: 'Back text' });
    const mcFile = el('input', { type: 'file', accept: 'image/*,audio/*', style: 'margin-top:4px;' });
    const mcPreview = el('div', { class: 'media-preview' });

    mediaCard.appendChild(el('label', null, ['Subject'])); mediaCard.appendChild(mcSubj);
    mediaCard.appendChild(el('label', null, ['Section'])); mediaCard.appendChild(mcSection);
    mediaCard.appendChild(el('label', null, ['Front'])); mediaCard.appendChild(mcFront);
    mediaCard.appendChild(el('label', null, ['Back'])); mediaCard.appendChild(mcBack);
    mediaCard.appendChild(el('label', null, ['Media file (image or audio)'])); mediaCard.appendChild(mcFile);
    mediaCard.appendChild(mcPreview);

    let mcFileData = null;
    mcFile.addEventListener('change', function () {
      mcPreview.innerHTML = '';
      mcFileData = null;
      const file = mcFile.files[0];
      if (!file) return;
      if (file.size > 10 * 1024 * 1024) { showError(mediaCard, 'File must be under 10 MB.'); mcFile.value = ''; return; }
      const reader = new FileReader();
      reader.onload = function (e) {
        const dataUrl = e.target.result;
        mcFileData = { base64: dataUrl.split(',')[1], filename: file.name, mimeType: file.type, mediaType: file.type.startsWith('image/') ? 'image' : 'audio' };
        if (mcFileData.mediaType === 'image') {
          mcPreview.appendChild(el('img', { src: dataUrl, style: 'max-width:100%;max-height:160px;border-radius:8px;margin-top:8px;' }));
        } else {
          const a = el('audio', { controls: 'true', style: 'margin-top:8px;display:block;' });
          a.src = dataUrl;
          mcPreview.appendChild(a);
        }
      };
      reader.readAsDataURL(file);
    });

    const mcBtn = el('button', { style: 'margin-top:10px;' }, ['Add card']);
    mediaCard.appendChild(mcBtn);
    mcBtn.addEventListener('click', function () {
      if (!mcSubj.value) { showError(mediaCard, 'Select a subject.'); return; }
      if (!mcFront.value.trim()) { showError(mediaCard, 'Front text required.'); return; }
      if (!mcBack.value.trim()) { showError(mediaCard, 'Back text required.'); return; }
      if (!mcFileData) { showError(mediaCard, 'Select a media file.'); return; }
      mcBtn.disabled = true; mcBtn.textContent = 'Uploading…';
      callAuth('teacher_addFlashcardWithMedia',
        mcSubj.value, mcSection.value.trim(), mcFront.value.trim(), mcBack.value.trim(),
        mcFileData.mediaType, mcFileData.base64, mcFileData.filename, mcFileData.mimeType
      ).then(function () {
        showOk(mediaCard, 'Card added.');
        mcSubj.value = ''; mcSection.value = ''; mcFront.value = ''; mcBack.value = '';
        mcFile.value = ''; mcPreview.innerHTML = ''; mcFileData = null;
        loadCounts();
      }).catch(function (e) { showError(mediaCard, e.message); })
        .then(function () { mcBtn.disabled = false; mcBtn.textContent = 'Add card'; });
    });
    main.appendChild(mediaCard);

    // Content upload — questions
    const qCard = el('div', { class: 'card' });
    qCard.appendChild(el('h2', null, ['Upload quiz questions']));
    qCard.appendChild(el('p', { class: 'muted small' }, ['CSV header row required. Columns: subject, section (optional), prompt, choiceA, choiceB, choiceC, choiceD, correctChoice, explanation (optional).']));
    const qTa = el('textarea', { placeholder: 'subject,section,prompt,choiceA,choiceB,choiceC,choiceD,correctChoice,explanation\nScience,Section 1,Water boils at (at sea level)?,50°C,75°C,100°C,212°C,C,100°C = 212°F.' });
    qCard.appendChild(qTa);
    const qBtn = el('button', { style: 'margin-top:10px;' }, ['Upload questions']);
    qCard.appendChild(qBtn);
    qBtn.addEventListener('click', function () {
      qBtn.disabled = true;
      callAuth('teacher_uploadQuestions', qTa.value).then(function (res) {
        const msg = 'Created ' + res.created + ' questions.' + (res.errors && res.errors.length ? ' Errors: ' + res.errors.join('; ') : '');
        showOk(qCard, msg);
        qTa.value = '';
        loadCounts();
      }).catch(function (e) { showError(qCard, e.message); })
        .then(function () { qBtn.disabled = false; });
    });
    main.appendChild(qCard);

    // Set cards due
    const dueCard = el('div', { class: 'card' });
    dueCard.appendChild(el('h2', null, ['Set cards due']));
    dueCard.appendChild(el('p', { class: 'muted small' }, ['Force cards due for all students who have already seen them. Students who haven\'t seen a card yet will encounter it naturally.']));

    const dcSubj = el('select');
    dcSubj.appendChild(el('option', { value: '' }, ['— select subject —']));
    (window.SUBJECTS || []).forEach(function (s) { dcSubj.appendChild(el('option', { value: s }, [s])); });
    const dcSection = el('input', { type: 'text', placeholder: 'Section (leave blank for all)' });
    const today = new Date().toISOString().slice(0, 10);
    const dcDate = el('input', { type: 'date', value: today });
    const dcBtn = el('button', { style: 'margin-top:10px;' }, ['Set due date']);

    dueCard.appendChild(el('label', null, ['Subject'])); dueCard.appendChild(dcSubj);
    dueCard.appendChild(el('label', null, ['Section (optional)'])); dueCard.appendChild(dcSection);
    dueCard.appendChild(el('label', null, ['Due date'])); dueCard.appendChild(dcDate);
    dueCard.appendChild(dcBtn);

    dcBtn.addEventListener('click', function () {
      if (!dcSubj.value) { showError(dueCard, 'Select a subject.'); return; }
      dcBtn.disabled = true;
      callAuth('teacher_setCardsDue', dcSubj.value, dcSection.value.trim() || null, dcDate.value).then(function (res) {
        showOk(dueCard, 'Updated ' + res.updated + ' student progress record' + (res.updated === 1 ? '' : 's') + '.');
      }).catch(function (e) { showError(dueCard, e.message); })
        .then(function () { dcBtn.disabled = false; });
    });
    main.appendChild(dueCard);

    // Content manager (edit / delete existing flashcards and questions)
    main.appendChild(renderContentManager(loadCounts));

    // Content counts + participation report
    const reportCard = el('div', { class: 'card' });
    reportCard.appendChild(el('h2', null, ['Content & participation']));
    const reportBody = el('div', null, ['Loading…']);
    reportCard.appendChild(reportBody);
    main.appendChild(reportCard);

    function loadCounts() {
      reportBody.innerHTML = 'Loading…';
      Promise.all([
        callAuth('teacher_contentCounts'),
        callAuth('teacher_studentReport'),
        callAuth('teacher_subjectReport')
      ]).then(function (all) {
        const counts = all[0];
        const students = all[1];
        const subjects = all[2];
        reportBody.innerHTML = '';

        reportBody.appendChild(el('h3', null, ['Content by subject']));
        const t1 = el('table');
        t1.innerHTML = '<thead><tr><th>Subject</th><th>Flashcards</th><th>Questions</th><th>Quiz avg</th><th>Quiz attempts</th></tr></thead>';
        const t1b = el('tbody');
        (window.SUBJECTS || []).forEach(function (subj) {
          const c = counts[subj] || { flashcards: 0, questions: 0 };
          const sr = subjects.filter(function (x) { return x.subject === subj; })[0] || {};
          const tr = el('tr');
          tr.innerHTML = '<td>' + escapeHtml(subj) + '</td><td>' + c.flashcards + '</td><td>' + c.questions
            + '</td><td>' + (sr.avgPct != null ? sr.avgPct + '%' : '—')
            + '</td><td>' + (sr.attempts || 0) + '</td>';
          t1b.appendChild(tr);
        });
        t1.appendChild(t1b);
        reportBody.appendChild(t1);

        reportBody.appendChild(el('h3', null, ['Per-student participation']));
        const t2 = el('table');
        t2.innerHTML = '<thead><tr><th>Student</th><th>Cards reviewed</th><th>Quiz attempts</th><th>Quiz avg</th><th>Last active</th></tr></thead>';
        const t2b = el('tbody');
        students.forEach(function (r) {
          const tr = el('tr');
          tr.innerHTML = '<td>' + escapeHtml(r.name || r.email) + '<div class="muted small">' + escapeHtml(r.email) + '</div></td>'
            + '<td>' + r.cardsReviewed + '</td>'
            + '<td>' + r.quizAttempts + '</td>'
            + '<td>' + (r.quizAvgPct != null ? r.quizAvgPct + '%' : '—') + '</td>'
            + '<td>' + (r.lastActiveAt ? new Date(r.lastActiveAt).toLocaleString() : '—') + '</td>';
          t2b.appendChild(tr);
        });
        t2.appendChild(t2b);
        reportBody.appendChild(t2);

        const csvBtn = el('button', { class: 'ghost', style: 'margin-top:10px;' }, ['Export participation CSV']);
        csvBtn.addEventListener('click', function () { downloadCsv_(students); });
        reportBody.appendChild(csvBtn);
      }).catch(function (err) { reportBody.innerHTML = ''; showError(reportCard, err.message); });
    }
    loadCounts();
  }

  function downloadCsv_(rows) {
    const cols = ['email', 'name', 'cardsReviewed', 'quizAttempts', 'quizAvgPct', 'lastActiveAt'];
    const lines = [cols.join(',')];
    rows.forEach(function (r) {
      lines.push(cols.map(function (c) {
        const v = r[c] == null ? '' : String(r[c]);
        return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
      }).join(','));
    });
    const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'acdec_participation_' + new Date().toISOString().slice(0, 10) + '.csv';
    a.click();
    URL.revokeObjectURL(a.href);
  }

  // --------------------------------------------------------------------------
  // Content manager: tabbed list of flashcards / questions with filter + edit.
  // `onContentChanged` is called after any save/delete so the surrounding
  // reports can refresh their counts.
  // --------------------------------------------------------------------------
  function renderContentManager(onContentChanged) {
    const card = el('div', { class: 'card' });
    card.appendChild(el('h2', null, ['Edit content']));
    card.appendChild(el('p', { class: 'muted small' }, ['Filter and search existing flashcards or questions. Click "Edit" on any row to modify it.']));

    const state = {
      kind: 'flashcards',  // or 'questions'
      subject: '',
      section: '',
      search: '',
      page: 1,
      pageSize: 25
    };

    // Tabs
    const tabs = el('div', { class: 'tabs' });
    const tabFlash = el('button', { class: 'tab active' }, ['Flashcards']);
    const tabQs = el('button', { class: 'tab' }, ['Questions']);
    tabs.appendChild(tabFlash);
    tabs.appendChild(tabQs);
    card.appendChild(tabs);

    // Filter row
    const filter = el('div', { class: 'filter-row' });
    const subjSel = el('select');
    subjSel.appendChild(el('option', { value: '' }, ['All subjects']));
    (window.SUBJECTS || []).forEach(function (s) { subjSel.appendChild(el('option', { value: s }, [s])); });
    const sectSel = el('select');
    sectSel.appendChild(el('option', { value: '' }, ['All sections']));
    const searchInp = el('input', { type: 'search', placeholder: 'Search…' });
    const clearBtn = el('button', { class: 'ghost' }, ['Clear']);
    filter.appendChild(wrapLabel_('Subject', subjSel));
    filter.appendChild(wrapLabel_('Section', sectSel));
    filter.appendChild(wrapLabel_('Search', searchInp));
    const clearWrap = el('div');
    clearWrap.appendChild(el('label', { style: 'visibility:hidden;' }, [' ']));
    clearWrap.appendChild(clearBtn);
    filter.appendChild(clearWrap);
    card.appendChild(filter);

    const countLine = el('p', { class: 'muted small', style: 'margin:10px 0 4px;' }, ['']);
    card.appendChild(countLine);

    const list = el('ul', { class: 'content-list' });
    card.appendChild(list);

    const pager = el('div', { class: 'pager' });
    const prevBtn = el('button', { class: 'ghost' }, ['← Prev']);
    const pageLabel = el('span', null, ['Page 1']);
    const nextBtn = el('button', { class: 'ghost' }, ['Next →']);
    pager.appendChild(prevBtn); pager.appendChild(pageLabel); pager.appendChild(nextBtn);
    card.appendChild(pager);

    function setKind(kind) {
      state.kind = kind;
      state.page = 1;
      tabFlash.classList.toggle('active', kind === 'flashcards');
      tabQs.classList.toggle('active', kind === 'questions');
      refreshSectionOptions();
      load();
    }
    tabFlash.addEventListener('click', function () { setKind('flashcards'); });
    tabQs.addEventListener('click', function () { setKind('questions'); });

    function refreshSectionOptions() {
      sectSel.innerHTML = '';
      sectSel.appendChild(el('option', { value: '' }, ['All sections']));
      callAuth('teacher_listSections', state.subject || null, state.kind).then(function (sections) {
        sections.forEach(function (name) { sectSel.appendChild(el('option', { value: name }, [name])); });
        if (sections.indexOf(state.section) === -1) state.section = '';
        sectSel.value = state.section;
      }).catch(function () { /* ignore */ });
    }

    subjSel.addEventListener('change', function () {
      state.subject = subjSel.value; state.section = ''; state.page = 1;
      refreshSectionOptions(); load();
    });
    sectSel.addEventListener('change', function () {
      state.section = sectSel.value; state.page = 1; load();
    });
    let searchTimer = null;
    searchInp.addEventListener('input', function () {
      if (searchTimer) clearTimeout(searchTimer);
      searchTimer = setTimeout(function () { state.search = searchInp.value; state.page = 1; load(); }, 250);
    });
    clearBtn.addEventListener('click', function () {
      state.subject = ''; state.section = ''; state.search = ''; state.page = 1;
      subjSel.value = ''; sectSel.value = ''; searchInp.value = '';
      refreshSectionOptions(); load();
    });
    prevBtn.addEventListener('click', function () { if (state.page > 1) { state.page -= 1; load(); } });
    nextBtn.addEventListener('click', function () { state.page += 1; load(); });

    function load() {
      list.innerHTML = '<li class="muted small">Loading…</li>';
      const fn = state.kind === 'questions' ? 'teacher_listQuestions' : 'teacher_listFlashcards';
      callAuth(fn, {
        subject: state.subject || null,
        section: state.section || null,
        search: state.search || null,
        page: state.page,
        pageSize: state.pageSize
      }).then(function (res) {
        render(res);
      }).catch(function (err) {
        list.innerHTML = '';
        showError(card, err.message);
      });
    }

    function render(res) {
      list.innerHTML = '';
      const start = (res.page - 1) * res.pageSize + 1;
      const end = Math.min(res.total, start + res.rows.length - 1);
      countLine.textContent = res.total === 0
        ? 'No results.'
        : 'Showing ' + start + '–' + end + ' of ' + res.total;
      pageLabel.textContent = 'Page ' + res.page;
      prevBtn.disabled = res.page <= 1;
      nextBtn.disabled = end >= res.total;

      res.rows.forEach(function (r) {
        list.appendChild(state.kind === 'questions' ? renderQuestionRow_(r, load, onContentChanged, card) : renderFlashcardRow_(r, load, onContentChanged, card));
      });
    }

    refreshSectionOptions();
    load();
    return card;
  }

  function wrapLabel_(text, input) {
    const w = el('div');
    w.appendChild(el('label', null, [text]));
    w.appendChild(input);
    return w;
  }

  function renderFlashcardRow_(c, reload, onChanged, outerCard) {
    const li = el('li');
    const row = el('div', { class: 'content-row' });
    row.appendChild(el('span', { class: 'tag' }, [c.subject]));
    if (c.section) row.appendChild(el('span', { class: 'tag' }, [c.section]));
    row.appendChild(el('span', { class: 'txt' }, [c.front + '  →  ' + c.back]));
    const actions = el('div', { class: 'actions' });
    const editBtn = el('button', { class: 'ghost' }, ['Edit']);
    const delBtn = el('button', { class: 'danger' }, ['Delete']);
    actions.appendChild(editBtn); actions.appendChild(delBtn);
    row.appendChild(actions);
    li.appendChild(row);

    const form = el('div', { class: 'edit-form', hidden: 'hidden' });
    li.appendChild(form);

    editBtn.addEventListener('click', function () {
      if (!form.hidden) { form.hidden = true; return; }
      buildFlashcardForm_(form, c, function () { form.hidden = true; reload(); if (onChanged) onChanged(); }, outerCard);
      form.hidden = false;
    });
    delBtn.addEventListener('click', function () {
      if (!confirm('Delete this flashcard? This also removes student progress for it.')) return;
      callAuth('teacher_deleteFlashcard', c.cardId).then(function () {
        reload(); if (onChanged) onChanged();
      }).catch(function (e) { showError(outerCard, e.message); });
    });
    return li;
  }

  function buildFlashcardForm_(container, c, onSaved, outerCard) {
    container.innerHTML = '';
    const subj = el('select');
    (window.SUBJECTS || []).forEach(function (s) { subj.appendChild(el('option', { value: s }, [s])); });
    subj.value = c.subject;
    const section = el('input', { type: 'text', value: c.section || '' });
    const front = el('textarea', { rows: '2' });
    front.value = c.front;
    const back = el('textarea', { rows: '3' });
    back.value = c.back;

    container.appendChild(el('label', null, ['Subject']));
    container.appendChild(subj);
    container.appendChild(el('label', null, ['Section (leave blank for none)']));
    container.appendChild(section);
    container.appendChild(el('label', null, ['Front']));
    container.appendChild(front);
    container.appendChild(el('label', null, ['Back']));
    container.appendChild(back);

    const row = el('div', { class: 'btn-row', style: 'margin-top:10px;' });
    const save = el('button', null, ['Save']);
    const cancel = el('button', { class: 'ghost' }, ['Cancel']);
    row.appendChild(save); row.appendChild(cancel);
    container.appendChild(row);

    save.addEventListener('click', function () {
      save.disabled = true;
      callAuth('teacher_updateFlashcard', c.cardId, {
        subject: subj.value,
        section: section.value,
        front: front.value,
        back: back.value
      }).then(function () { onSaved(); })
        .catch(function (e) { showError(outerCard, e.message); save.disabled = false; });
    });
    cancel.addEventListener('click', function () { container.hidden = true; });
  }

  function renderQuestionRow_(q, reload, onChanged, outerCard) {
    const li = el('li');
    const row = el('div', { class: 'content-row' });
    row.appendChild(el('span', { class: 'tag' }, [q.subject]));
    if (q.section) row.appendChild(el('span', { class: 'tag' }, [q.section]));
    row.appendChild(el('span', { class: 'txt' }, [q.prompt + '  (ans: ' + q.correctChoice + ')']));
    const actions = el('div', { class: 'actions' });
    const editBtn = el('button', { class: 'ghost' }, ['Edit']);
    const delBtn = el('button', { class: 'danger' }, ['Delete']);
    actions.appendChild(editBtn); actions.appendChild(delBtn);
    row.appendChild(actions);
    li.appendChild(row);

    const form = el('div', { class: 'edit-form', hidden: 'hidden' });
    li.appendChild(form);

    editBtn.addEventListener('click', function () {
      if (!form.hidden) { form.hidden = true; return; }
      buildQuestionForm_(form, q, function () { form.hidden = true; reload(); if (onChanged) onChanged(); }, outerCard);
      form.hidden = false;
    });
    delBtn.addEventListener('click', function () {
      if (!confirm('Delete this question? Quiz history is preserved.')) return;
      callAuth('teacher_deleteQuestion', q.questionId).then(function () {
        reload(); if (onChanged) onChanged();
      }).catch(function (e) { showError(outerCard, e.message); });
    });
    return li;
  }

  function buildQuestionForm_(container, q, onSaved, outerCard) {
    container.innerHTML = '';
    const subj = el('select');
    (window.SUBJECTS || []).forEach(function (s) { subj.appendChild(el('option', { value: s }, [s])); });
    subj.value = q.subject;
    const section = el('input', { type: 'text', value: q.section || '' });
    const prompt = el('textarea', { rows: '2' });
    prompt.value = q.prompt;
    const inputs = {};
    ['A', 'B', 'C', 'D'].forEach(function (L) {
      const i = el('input', { type: 'text' });
      i.value = q['choice' + L] || '';
      inputs[L] = i;
    });
    const correct = el('select');
    ['A', 'B', 'C', 'D'].forEach(function (L) { correct.appendChild(el('option', { value: L }, [L])); });
    correct.value = q.correctChoice;
    const expl = el('textarea', { rows: '2' });
    expl.value = q.explanation || '';

    container.appendChild(el('label', null, ['Subject']));
    container.appendChild(subj);
    container.appendChild(el('label', null, ['Section (leave blank for none)']));
    container.appendChild(section);
    container.appendChild(el('label', null, ['Prompt']));
    container.appendChild(prompt);
    ['A', 'B', 'C', 'D'].forEach(function (L) {
      container.appendChild(el('label', null, ['Choice ' + L]));
      container.appendChild(inputs[L]);
    });
    container.appendChild(el('label', null, ['Correct choice']));
    container.appendChild(correct);
    container.appendChild(el('label', null, ['Explanation (optional)']));
    container.appendChild(expl);

    const row = el('div', { class: 'btn-row', style: 'margin-top:10px;' });
    const save = el('button', null, ['Save']);
    const cancel = el('button', { class: 'ghost' }, ['Cancel']);
    row.appendChild(save); row.appendChild(cancel);
    container.appendChild(row);

    save.addEventListener('click', function () {
      save.disabled = true;
      callAuth('teacher_updateQuestion', q.questionId, {
        subject: subj.value,
        section: section.value,
        prompt: prompt.value,
        choiceA: inputs.A.value,
        choiceB: inputs.B.value,
        choiceC: inputs.C.value,
        choiceD: inputs.D.value,
        correctChoice: correct.value,
        explanation: expl.value
      }).then(function () { onSaved(); })
        .catch(function (e) { showError(outerCard, e.message); save.disabled = false; });
    });
    cancel.addEventListener('click', function () { container.hidden = true; });
  }
</script>
