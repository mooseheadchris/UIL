<script>
  function renderQuiz(main, s) {
    main.innerHTML = '';
    const card = el('div', { class: 'card' });
    card.appendChild(el('h2', null, ['Take a quiz']));
    card.appendChild(el('label', null, ['Subject']));
    const subjSelect = el('select');
    (window.SUBJECTS || []).forEach(function (subj) {
      subjSelect.appendChild(el('option', { value: subj }, [subj]));
    });
    card.appendChild(subjSelect);

    const sectionLabel = el('label', { style: 'display:none;' }, ['Section']);
    const sectionSelect = el('select', { style: 'display:none;' });
    card.appendChild(sectionLabel);
    card.appendChild(sectionSelect);

    function refreshSections() {
      sectionSelect.innerHTML = '';
      sectionSelect.appendChild(el('option', { value: '' }, ['All sections']));
      if (!subjSelect.value) {
        sectionLabel.style.display = 'none';
        sectionSelect.style.display = 'none';
        return;
      }
      callAuth('listSections', subjSelect.value, 'questions').then(function (sections) {
        if (!sections.length) {
          sectionLabel.style.display = 'none';
          sectionSelect.style.display = 'none';
          return;
        }
        sections.forEach(function (name) {
          sectionSelect.appendChild(el('option', { value: name }, [name]));
        });
        sectionLabel.style.display = '';
        sectionSelect.style.display = '';
      }).catch(function () { /* ignore */ });
    }
    subjSelect.addEventListener('change', refreshSections);
    refreshSections();

    card.appendChild(el('label', null, ['Number of questions']));
    const n = el('input', { type: 'number', min: '1', max: '50', value: '10' });
    card.appendChild(n);
    const startBtn = el('button', { style: 'margin-top:16px;' }, ['Start quiz']);
    card.appendChild(startBtn);
    main.appendChild(card);

    startBtn.addEventListener('click', function () {
      startBtn.disabled = true;
      startBtn.textContent = 'Loading…';
      const sectionVal = sectionSelect.value || null;
      callAuth('startQuiz', subjSelect.value, sectionVal, Number(n.value) || 10).then(function (res) {
        runQuiz(main, res);
      }).catch(function (err) {
        startBtn.disabled = false;
        startBtn.textContent = 'Start quiz';
        showError(card, err.message);
      });
    });
  }

  // Dispatch to the right quiz mode based on subject.
  function runQuiz(main, quiz) {
    var answers = {};
    var startTime = Date.now();
    if (quiz.subject === 'Number Sense') {
      runNumberSenseQuiz(main, quiz, answers, startTime);
    } else if (quiz.subject === 'Calculator') {
      runCalculatorQuiz(main, quiz, answers, startTime);
    } else {
      runMCQQuiz(main, quiz, answers);
    }
  }

  // A-E multiple-choice quiz (Science, Mathematics, Computer Science).
  function runMCQQuiz(main, quiz, answers) {
    main.innerHTML = '';
    var header = el('div', { class: 'card' });
    header.appendChild(el('h2', null, [quiz.subject + ' quiz']));
    header.appendChild(el('p', { class: 'muted' }, [quiz.questions.length + ' questions. Choose one answer per question, then submit.']));
    main.appendChild(header);

    var qCards = [];
    quiz.questions.forEach(function (q, idx) {
      var qc = el('div', { class: 'card' });
      qc.appendChild(el('h2', null, ['Question ' + (idx + 1)]));
      qc.appendChild(el('p', null, [q.prompt]));
      var letters = ['A', 'B', 'C', 'D'];
      if (q.choices && q.choices.E) letters.push('E');
      letters.forEach(function (letter) {
        var id = 'q_' + q.questionId + '_' + letter;
        var label = el('label', { class: 'choice', for: id });
        var input = el('input', { type: 'radio', name: 'q_' + q.questionId, id: id, value: letter });
        input.addEventListener('change', function () { answers[q.questionId] = letter; });
        label.appendChild(input);
        label.appendChild(document.createTextNode(letter + '. ' + q.choices[letter]));
        qc.appendChild(label);
      });
      renderMath(qc);
      main.appendChild(qc);
      qCards.push(qc);
    });

    var submitCard = el('div', { class: 'card' });
    var submitBtn = el('button', null, ['Submit quiz']);
    submitCard.appendChild(submitBtn);
    main.appendChild(submitCard);

    submitBtn.addEventListener('click', function () {
      submitBtn.disabled = true;
      submitBtn.textContent = 'Scoring…';
      callAuth('submitQuiz', quiz.attemptId, answers).then(function (result) {
        renderQuizResult(main, quiz, result, qCards, null);
      }).catch(function (err) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit quiz';
        showError(submitCard, err.message);
      });
    });
  }

  // Number Sense: one question at a time with text input.
  function runNumberSenseQuiz(main, quiz, answers, startTime) {
    var currentIdx = 0;

    function showQuestion(idx) {
      main.innerHTML = '';
      var q = quiz.questions[idx];
      var isLast = idx === quiz.questions.length - 1;

      var progCard = el('div', { class: 'card' });
      progCard.appendChild(el('p', { class: 'muted', style: 'margin:0;' }, ['Question ' + (idx + 1) + ' of ' + quiz.questions.length]));
      main.appendChild(progCard);

      var qc = el('div', { class: 'card' });
      qc.appendChild(el('h2', null, ['Question ' + (idx + 1)]));
      qc.appendChild(el('p', null, [q.prompt]));

      var input = el('input', {
        type: 'text',
        placeholder: 'Type your answer…',
        style: 'font-size:1.1em;margin:12px 0;width:100%;box-sizing:border-box;'
      });
      if (answers[q.questionId] !== undefined) input.value = answers[q.questionId];
      qc.appendChild(input);

      var btnRow = el('div', { class: 'btn-row', style: 'margin-top:8px;' });
      if (idx > 0) {
        var backBtn = el('button', { class: 'btn ghost' }, ['← Back']);
        backBtn.addEventListener('click', function () {
          answers[q.questionId] = input.value.trim();
          currentIdx--;
          showQuestion(currentIdx);
        });
        btnRow.appendChild(backBtn);
      }
      var nextBtn = el('button', { class: 'btn' }, [isLast ? 'Submit' : 'Next →']);
      btnRow.appendChild(nextBtn);
      qc.appendChild(btnRow);

      function proceed() {
        answers[q.questionId] = input.value.trim();
        if (isLast) {
          nextBtn.disabled = true;
          nextBtn.textContent = 'Scoring…';
          callAuth('submitQuiz', quiz.attemptId, answers).then(function (result) {
            renderQuizResult(main, quiz, result, null, Date.now() - startTime);
          }).catch(function (err) {
            nextBtn.disabled = false;
            nextBtn.textContent = 'Submit';
            showError(qc, err.message);
          });
        } else {
          currentIdx++;
          showQuestion(currentIdx);
        }
      }

      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') proceed(); });
      nextBtn.addEventListener('click', proceed);

      renderMath(qc);
      main.appendChild(qc);
      input.focus();
    }

    showQuestion(0);
  }

  // Calculator: 5 questions per page with text inputs.
  function runCalculatorQuiz(main, quiz, answers, startTime) {
    var PAGE_SIZE = 5;
    var currentPage = 0;

    function savePageAnswers(page) {
      var start = page * PAGE_SIZE;
      var end = Math.min(start + PAGE_SIZE, quiz.questions.length);
      for (var i = start; i < end; i++) {
        var input = main.querySelector('[data-qid="' + quiz.questions[i].questionId + '"]');
        if (input) answers[quiz.questions[i].questionId] = input.value.trim();
      }
    }

    function showPage(page) {
      main.innerHTML = '';
      var start = page * PAGE_SIZE;
      var end = Math.min(start + PAGE_SIZE, quiz.questions.length);
      var isLast = end >= quiz.questions.length;

      var header = el('div', { class: 'card' });
      header.appendChild(el('h2', null, [quiz.subject + ' quiz']));
      header.appendChild(el('p', { class: 'muted', style: 'margin:0;' }, ['Questions ' + (start + 1) + '–' + end + ' of ' + quiz.questions.length]));
      main.appendChild(header);

      for (var i = start; i < end; i++) {
        var q = quiz.questions[i];
        var qc = el('div', { class: 'card' });
        qc.appendChild(el('h2', null, ['Question ' + (i + 1)]));
        qc.appendChild(el('p', null, [q.prompt]));
        var ansRow = el('div', { style: 'display:flex;align-items:center;gap:8px;margin-top:8px;' });
        ansRow.appendChild(el('label', null, ['Answer:']));
        var input = el('input', {
          type: 'text',
          placeholder: '…',
          'data-qid': q.questionId,
          style: 'flex:1;'
        });
        if (answers[q.questionId] !== undefined) input.value = answers[q.questionId];
        ansRow.appendChild(input);
        qc.appendChild(ansRow);
        renderMath(qc);
        main.appendChild(qc);
      }

      var btnCard = el('div', { class: 'card' });
      var btnRow = el('div', { class: 'btn-row' });
      if (page > 0) {
        var backBtn = el('button', { class: 'btn ghost' }, ['← Previous']);
        backBtn.addEventListener('click', function () {
          savePageAnswers(page);
          currentPage--;
          showPage(currentPage);
        });
        btnRow.appendChild(backBtn);
      }
      var nextBtn = el('button', { class: 'btn' }, [isLast ? 'Submit' : 'Next 5 →']);
      nextBtn.addEventListener('click', function () {
        savePageAnswers(page);
        if (isLast) {
          nextBtn.disabled = true;
          nextBtn.textContent = 'Scoring…';
          callAuth('submitQuiz', quiz.attemptId, answers).then(function (result) {
            renderQuizResult(main, quiz, result, null, Date.now() - startTime);
          }).catch(function (err) {
            nextBtn.disabled = false;
            nextBtn.textContent = 'Submit';
            showError(btnCard, err.message);
          });
        } else {
          currentPage++;
          showPage(currentPage);
        }
      });
      btnRow.appendChild(nextBtn);
      btnCard.appendChild(btnRow);
      main.appendChild(btnCard);
    }

    showPage(0);
  }

  function renderQuizResult(main, quiz, result, qCards, elapsedMs) {
    var pct = Math.round(100 * result.score / result.total);
    var topCard = el('div', { class: 'card' });
    topCard.appendChild(el('h2', null, ['You scored ' + result.score + ' / ' + result.total + '  (' + pct + '%)']));
    if (elapsedMs != null) {
      topCard.appendChild(el('p', { class: 'muted' }, ['Time: ' + formatTime_(elapsedMs)]));
    }
    var row = el('div', { class: 'btn-row' });
    row.appendChild(el('a', { class: 'btn', href: '#/quiz' }, ['Another quiz']));
    row.appendChild(el('a', { class: 'btn ghost', href: '#/' }, ['Back to dashboard']));
    topCard.appendChild(row);

    if (qCards) {
      // MCQ: insert score card at top and overlay correct/incorrect on existing cards.
      main.insertBefore(topCard, main.firstChild);
      var byQ = {};
      result.breakdown.forEach(function (b) { byQ[b.questionId] = b; });
      quiz.questions.forEach(function (q, idx) {
        var b = byQ[q.questionId];
        if (!b) return;
        var qc = qCards[idx];
        var choices = qc.querySelectorAll('.choice');
        choices.forEach(function (label) {
          var input = label.querySelector('input');
          input.disabled = true;
          if (input.value === b.correct) label.classList.add('correct');
          if (b.chosen && input.value === b.chosen && !b.isCorrect) label.classList.add('incorrect');
        });
        if (b.explanation) {
          var expP = el('p', { class: 'muted small' });
          expP.textContent = 'Explanation: ' + b.explanation;
          qc.appendChild(expP);
          renderMath(expP);
        }
      });
      var last = main.lastElementChild;
      if (last) last.remove();
    } else {
      // Free-response: clear and build fresh result cards.
      main.innerHTML = '';
      main.appendChild(topCard);
      var byQ2 = {};
      result.breakdown.forEach(function (b) { byQ2[b.questionId] = b; });
      quiz.questions.forEach(function (q, idx) {
        var b = byQ2[q.questionId];
        if (!b) return;
        var qc = el('div', { class: 'card' });
        qc.appendChild(el('h2', null, ['Question ' + (idx + 1)]));
        qc.appendChild(el('p', null, [q.prompt]));
        var statusStyle = b.isCorrect
          ? 'background:#edf9f1;border:1px solid var(--good,#22c55e);border-radius:6px;padding:10px;margin-top:8px;'
          : 'background:#fdeeeb;border:1px solid var(--bad,#ef4444);border-radius:6px;padding:10px;margin-top:8px;';
        var statusDiv = el('div', { style: statusStyle });
        statusDiv.appendChild(el('p', { style: 'margin:0;' }, [
          'Your answer: ' + (b.chosen || '(blank)') + '  ' + (b.isCorrect ? '✓' : '✗')
        ]));
        if (!b.isCorrect) {
          statusDiv.appendChild(el('p', { style: 'margin:4px 0 0;font-size:.9em;' }, ['Correct: ' + b.correct]));
        }
        qc.appendChild(statusDiv);
        if (b.explanation) {
          var expP = el('p', { class: 'muted small' });
          expP.textContent = 'Explanation: ' + b.explanation;
          qc.appendChild(expP);
          renderMath(expP);
        }
        renderMath(qc);
        main.appendChild(qc);
      });
    }
  }

  function formatTime_(ms) {
    var s = Math.floor(ms / 1000);
    var m = Math.floor(s / 60);
    var sec = s % 60;
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }
</script>
